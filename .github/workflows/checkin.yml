name: WorkBuddy 每日签到（已暂停）

on:
  schedule:
    # 已暂停：用户 2026-11-25 要求停止云端签到。
    # 恢复：把下面的 cron 改回 "50 23 * * *"（UTC 23:50 = 北京时间次日 07:50）
    - cron: "0 0 30 2 *"   # 永不触发（2月30日不存在）
  workflow_dispatch:
    # 注意：workflow_dispatch 仍可手动触发；如需彻底停用请删掉本 workflow
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install --quiet pynacl
      - name: 用 refreshToken 换 accessToken 并签到
        env:
          WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
        run: python3 -u wb_cloud_checkin.py
